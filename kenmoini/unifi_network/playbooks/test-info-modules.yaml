    - name: Get specific Traffic Matching List info from Unifi Network
      kenmoini.unifi_network.traffic_matching_list_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
        unifi_network_traffic_matching_list_id: "{{ traffic_matching_lists_info_result.traffic_matching_lists_info.data[0].id }}"
      register: traffic_matching_list_info_result

    - name: Show specific Traffic Matching List info
      debug:
