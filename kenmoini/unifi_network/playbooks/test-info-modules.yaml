---
# Exercises every read-only module against a real UniFi Network application.
# Run it normally and with --check: info modules must return the same data in both modes.
#   export UNIFI_NETWORK_URL=https://192.168.1.1 UNIFI_NETWORK_API_KEY=... [UNIFI_NETWORK_SITE=default]
#   ansible-playbook playbooks/test-info-modules.yaml [--check]
- name: Test the read-only modules of the kenmoini.unifi_network collection
  hosts: localhost
  gather_facts: false

  module_defaults:
    group/kenmoini.unifi_network.fullset:
      unifi_network_skip_tls_verify: true

  vars:
    site: "{{ lookup('ansible.builtin.env', 'UNIFI_NETWORK_SITE') | default('default', true) }}"

  tasks:
    - name: Get application info
      kenmoini.unifi_network.application_info:
      register: r_app

    - name: Show the application version
      ansible.builtin.debug:
        msg: "UniFi Network {{ r_app.application.applicationVersion | default('unknown') }}"

    - name: List sites
      kenmoini.unifi_network.site_info:
      register: r_sites

    - name: Get the selected site by name or internal reference
      kenmoini.unifi_network.site_info:
        filters_match: any
        filters:
          - {property: name, function: eq, value: "{{ site }}"}
          - {property: internalReference, function: eq, value: "{{ site }}"}
      register: r_site

    - name: The selected site exists
      ansible.builtin.assert:
        that:
          - r_sites.sites | length > 0
          - r_site.sites | length == 1

    - name: List with device_info
      kenmoini.unifi_network.device_info:
        unifi_network_site_id: "{{ site }}"
      register: r_devices

    - name: device_info returns a list
      ansible.builtin.assert:
        that: r_devices.devices is sequence
        quiet: true

    - name: List with pending_device_info
      kenmoini.unifi_network.pending_device_info:
      register: r_pending_devices

    - name: pending_device_info returns a list
      ansible.builtin.assert:
        that: r_pending_devices.pending_devices is sequence
        quiet: true

    - name: List with client_info
      kenmoini.unifi_network.client_info:
        unifi_network_site_id: "{{ site }}"
      register: r_clients

    - name: client_info returns a list
      ansible.builtin.assert:
        that: r_clients.clients is sequence
        quiet: true

    - name: List with network_info
      kenmoini.unifi_network.network_info:
        unifi_network_site_id: "{{ site }}"
      register: r_networks

    - name: network_info returns a list
      ansible.builtin.assert:
        that: r_networks.networks is sequence
        quiet: true

    - name: List with firewall_zone_info
      kenmoini.unifi_network.firewall_zone_info:
        unifi_network_site_id: "{{ site }}"
      register: r_firewall_zones

    - name: firewall_zone_info returns a list
      ansible.builtin.assert:
        that: r_firewall_zones.firewall_zones is sequence
        quiet: true

    - name: List with firewall_policy_info
      kenmoini.unifi_network.firewall_policy_info:
        unifi_network_site_id: "{{ site }}"
      register: r_firewall_policies

    - name: firewall_policy_info returns a list
      ansible.builtin.assert:
        that: r_firewall_policies.firewall_policies is sequence
        quiet: true

    - name: List with acl_rule_info
      kenmoini.unifi_network.acl_rule_info:
        unifi_network_site_id: "{{ site }}"
      register: r_acl_rules

    - name: acl_rule_info returns a list
      ansible.builtin.assert:
        that: r_acl_rules.acl_rules is sequence
        quiet: true

    - name: List with dns_policy_info
      kenmoini.unifi_network.dns_policy_info:
        unifi_network_site_id: "{{ site }}"
      register: r_dns_policies

    - name: dns_policy_info returns a list
      ansible.builtin.assert:
        that: r_dns_policies.dns_policies is sequence
        quiet: true

    - name: List with traffic_matching_list_info
      kenmoini.unifi_network.traffic_matching_list_info:
        unifi_network_site_id: "{{ site }}"
      register: r_traffic_matching_lists

    - name: traffic_matching_list_info returns a list
      ansible.builtin.assert:
        that: r_traffic_matching_lists.traffic_matching_lists is sequence
        quiet: true

    - name: List with wifi_broadcast_info
      kenmoini.unifi_network.wifi_broadcast_info:
        unifi_network_site_id: "{{ site }}"
      register: r_wifi_broadcasts

    - name: wifi_broadcast_info returns a list
      ansible.builtin.assert:
        that: r_wifi_broadcasts.wifi_broadcasts is sequence
        quiet: true

    - name: List with hotspot_voucher_info
      kenmoini.unifi_network.hotspot_voucher_info:
        unifi_network_site_id: "{{ site }}"
      register: r_hotspot_vouchers

    - name: hotspot_voucher_info returns a list
      ansible.builtin.assert:
        that: r_hotspot_vouchers.hotspot_vouchers is sequence
        quiet: true

    - name: List with radius_profile_info
      kenmoini.unifi_network.radius_profile_info:
        unifi_network_site_id: "{{ site }}"
      register: r_radius_profiles

    - name: radius_profile_info returns a list
      ansible.builtin.assert:
        that: r_radius_profiles.radius_profiles is sequence
        quiet: true

    - name: List with vpn_server_info
      kenmoini.unifi_network.vpn_server_info:
        unifi_network_site_id: "{{ site }}"
      register: r_vpn_servers

    - name: vpn_server_info returns a list
      ansible.builtin.assert:
        that: r_vpn_servers.vpn_servers is sequence
        quiet: true

    - name: List with site_to_site_tunnel_info
      kenmoini.unifi_network.site_to_site_tunnel_info:
        unifi_network_site_id: "{{ site }}"
      register: r_site_to_site_tunnels

    - name: site_to_site_tunnel_info returns a list
      ansible.builtin.assert:
        that: r_site_to_site_tunnels.site_to_site_tunnels is sequence
        quiet: true

    - name: List with wan_interface_info
      kenmoini.unifi_network.wan_interface_info:
        unifi_network_site_id: "{{ site }}"
      register: r_wan_interfaces

    - name: wan_interface_info returns a list
      ansible.builtin.assert:
        that: r_wan_interfaces.wan_interfaces is sequence
        quiet: true

    - name: List with device_tag_info
      kenmoini.unifi_network.device_tag_info:
        unifi_network_site_id: "{{ site }}"
      register: r_device_tags

    - name: device_tag_info returns a list
      ansible.builtin.assert:
        that: r_device_tags.device_tags is sequence
        quiet: true

    - name: List with lag_info
      kenmoini.unifi_network.lag_info:
        unifi_network_site_id: "{{ site }}"
      register: r_lags

    - name: lag_info returns a list
      ansible.builtin.assert:
        that: r_lags.lags is sequence
        quiet: true

    - name: List with mc_lag_domain_info
      kenmoini.unifi_network.mc_lag_domain_info:
        unifi_network_site_id: "{{ site }}"
      register: r_mc_lag_domains

    - name: mc_lag_domain_info returns a list
      ansible.builtin.assert:
        that: r_mc_lag_domains.mc_lag_domains is sequence
        quiet: true

    - name: List with switch_stack_info
      kenmoini.unifi_network.switch_stack_info:
        unifi_network_site_id: "{{ site }}"
      register: r_switch_stacks

    - name: switch_stack_info returns a list
      ansible.builtin.assert:
        that: r_switch_stacks.switch_stacks is sequence
        quiet: true

    - name: List the first 10 with country_info
      kenmoini.unifi_network.country_info:
        limit: 10
      register: r_countries

    - name: country_info honours limit
      ansible.builtin.assert:
        that: r_countries.countries | length <= 10
        quiet: true

    - name: List the first 10 with dpi_application_info
      kenmoini.unifi_network.dpi_application_info:
        limit: 10
      register: r_dpi_applications

    - name: dpi_application_info honours limit
      ansible.builtin.assert:
        that: r_dpi_applications.dpi_applications | length <= 10
        quiet: true

    - name: List the first 10 with dpi_category_info
      kenmoini.unifi_network.dpi_category_info:
        limit: 10
      register: r_dpi_categories

    - name: dpi_category_info honours limit
      ansible.builtin.assert:
        that: r_dpi_categories.dpi_categories | length <= 10
        quiet: true

    - name: Get one network by name, and its references
      when: r_networks.networks | length > 0
      block:
        - name: Get the first network by name
          kenmoini.unifi_network.network_info:
            unifi_network_site_id: "{{ site }}"
            name: "{{ r_networks.networks[0].name }}"
          register: r_network

        - name: Get the same network by id
          kenmoini.unifi_network.network_info:
            unifi_network_site_id: "{{ site }}"
            id: "{{ r_networks.networks[0].id }}"
          register: r_network_by_id

        - name: Name and id lookups agree
          ansible.builtin.assert:
            that: r_network.networks[0].id == r_network_by_id.networks[0].id

        - name: Get what references the network
          kenmoini.unifi_network.network_references_info:
            unifi_network_site_id: "{{ site }}"
            network: "{{ r_networks.networks[0].name }}"
          register: r_refs

    - name: Filter networks with typed values and OR logic
      kenmoini.unifi_network.network_info:
        unifi_network_site_id: "{{ site }}"
        filters_match: any
        filters:
          - {property: vlanId, function: ge, value: 2}
          - {property: enabled, function: eq, value: false}
      register: r_filtered

    - name: Get statistics for the first adopted device
      kenmoini.unifi_network.device_statistics_info:
        unifi_network_site_id: "{{ site }}"
        device: "{{ r_devices.devices[0].id }}"
      register: r_stats
      when: r_devices.devices | length > 0

    - name: Get the ACL rule order
      kenmoini.unifi_network.acl_rule_ordering_info:
        unifi_network_site_id: "{{ site }}"
      register: r_acl_order

    - name: Get the firewall policy order between the first two zones
      kenmoini.unifi_network.firewall_policy_ordering_info:
        unifi_network_site_id: "{{ site }}"
        source_zone: "{{ r_firewall_zones.firewall_zones[0].name }}"
        destination_zone: "{{ r_firewall_zones.firewall_zones[1].name }}"
      register: r_fw_order
      when: r_firewall_zones.firewall_zones | length > 1
