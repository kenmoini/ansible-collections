      kenmoini.unifi_network.wan_interfaces_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
      register: wan_interfaces_info_result

    - name: Show WAN interfaces info
      debug:
        var: wan_interfaces_info_result

    - name: Get site-to-site tunnels info from Unifi Network
      kenmoini.unifi_network.site_to_site_tunnels_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
      register: site_to_site_tunnels_info_result

    - name: Show site-to-site tunnels info
      debug:
        var: site_to_site_tunnels_info_result

    - name: Get VPN servers info from Unifi Network
      kenmoini.unifi_network.vpn_servers_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
      register: vpn_servers_info_result

    - name: Show VPN servers info
      debug:
        var: vpn_servers_info_result

    - name: Get device tags info from Unifi Network
      kenmoini.unifi_network.device_tags_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
      register: device_tags_info_result

    - name: Show device tags info
      debug:
        var: device_tags_info_result

    - name: Get DPI categories info from Unifi Network
      kenmoini.unifi_network.dpi_categories_info:
