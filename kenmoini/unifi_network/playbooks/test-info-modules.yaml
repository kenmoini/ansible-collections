    - name: Get Traffic Matching List info from Unifi Network
      kenmoini.unifi_network.traffic_matching_lists_info:
        unifi_network_site_id: "{{ site_result.site_info.data[0].id }}"
      register: traffic_matching_lists_info_result

    - name: Show Traffic Matching List info
      debug:
