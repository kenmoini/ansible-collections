---
# Imperative modules. The action tasks run in check mode unless you pass -e run_actions=true,
# because restarting a device or power cycling a port interrupts traffic.
#   ansible-playbook playbooks/test-action-modules.yaml -e device_name="U7 Pro" [-e port=1] [-e run_actions=true]
- name: Test the action modules of the kenmoini.unifi_network collection
  hosts: localhost
  gather_facts: false

  module_defaults:
    group/kenmoini.unifi_network.fullset:
      unifi_network_skip_tls_verify: true
      unifi_network_site_id: "{{ lookup('ansible.builtin.env', 'UNIFI_NETWORK_SITE') | default('default', true) }}"

  vars:
    run_actions: false

  tasks:
    - name: Find the device by name
      kenmoini.unifi_network.device_info:
        name: "{{ device_name }}"
      register: r_device

    - name: The device exists
      ansible.builtin.assert:
        that: r_device.devices | length == 1

    - name: Restart the device
      kenmoini.unifi_network.device_action:
        device: "{{ device_name }}"
        action: restart
      check_mode: "{{ not (run_actions | bool) }}"

    - name: Power cycle a PoE port on the device
      kenmoini.unifi_network.port_action:
        device: "{{ device_name }}"
        port: "{{ port }}"
        action: power_cycle
      check_mode: "{{ not (run_actions | bool) }}"
      when: port is defined
