---
# Collections must specify a minimum required ansible version to upload to galaxy
requires_ansible: '>=2.15.0'

# Old module names from 1.x keep working through redirects until 3.0.0.
# The new modules return a plain list (for example `networks`) instead of the raw API page (`networks_info.data`).
plugin_routing:
  modules:
    acl_rules_info:
      redirect: kenmoini.unifi_network.acl_rule_info
      deprecation:
        removal_version: 3.0.0
        warning_text: Use kenmoini.unifi_network.acl_rule_info instead. It returns a list of items rather than the raw API page.
    adopted_devices_info:
      redirect: kenmoini.unifi_network.device_info
      deprecation:
        removal_version: 3.0.0
        warning_text: Use kenmoini.unifi_network.device_info instead. It returns a list of items rather than the raw API page.
