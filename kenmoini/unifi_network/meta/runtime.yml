    - device_statistics_info
    - device_tag_info
    - dns_policy
    - dns_policy_info
    - dpi_application_info
    - dpi_category_info
    - firewall_policy
    - firewall_policy_info
    - firewall_policy_ordering
    - firewall_policy_ordering_info
    - firewall_zone
    - firewall_zone_info
    - hotspot_voucher
    - hotspot_voucher_info
    - lag_info
    - mc_lag_domain_info
    - network
    - network_info
    - network_references_info
    - pending_device_info
    - port_action
    - radius_profile_info
    - site_info
    - site_to_site_tunnel_info
    - switch_stack_info
    - traffic_matching_list
    - traffic_matching_list_info
    - vpn_server_info
    - wan_interface_info
    - wifi_broadcast
